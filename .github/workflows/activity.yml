name: Refresh activity chart

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# One run at a time; a newer run replaces a queued one.
concurrency:
  group: activity-chart
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Render isometric contribution chart
        env:
          # Add a PROFILE_TOKEN secret (read:user) to include private
          # contributions; otherwise the built-in token shows public ones.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-activity.mjs "${{ github.repository_owner }}"

      - name: Validate SVGs
        run: node scripts/validate.mjs

      - name: Commit only if changed
        run: |
          if git diff --quiet -- assets/activity-dark.svg assets/activity-light.svg; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg
          git commit -m "chore: refresh activity chart"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
